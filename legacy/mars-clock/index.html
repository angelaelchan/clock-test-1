<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mars Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@300;400&family=Jura:wght@300;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <main class="stage">
    <div class="planet" aria-hidden="true">
      <img class="planet__glow" src="/images/mars.png" alt="" />
      <img class="planet__img" src="/images/mars.png" alt="" />
    </div>

    <section class="card" aria-label="Mars clock">
      <div class="card__top">
        <button class="zone" type="button" id="zone" aria-label="Next time zone">
          <span id="zone-label">Time Zone #1</span>
          <img src="/images/chevron-right.svg" width="24" height="24" alt="" />
        </button>
        <div class="clock" aria-live="off">
          <span class="clock__hm" id="clock-hm">14:02</span>
          <span class="clock__s" id="clock-s">36</span>
        </div>
      </div>

      <div class="sol">
        <div class="sol__head">
          <span class="sol__title">SOL CYCLE</span>
          <span class="badge" title="Time until sunset">
            <img src="/images/sunset.svg" width="16" height="16" alt="" />
            <span id="to-sunset">2h<span class="badge__gap"> </span>32m</span>
          </span>
        </div>
        <div class="timeline" id="timeline">
          <span class="timeline__now" id="now-label">14:02</span>
          <span class="timeline__mark" id="sunrise-mark">
            <img src="/images/sunrise-small.svg" width="9" height="9" alt="Sunrise" />
            <span id="sunrise-label">6:05</span>
          </span>
          <span class="timeline__mark" id="sunset-mark">
            <img src="/images/sunset-small.svg" width="9" height="9" alt="Sunset" />
            <span id="sunset-label">16:34</span>
          </span>
        </div>
      </div>

      <dl class="details">
        <div class="details__row"><dt>Earth-Mars Delta</dt><dd id="delta">1:23 +</dd></div>
        <div class="details__row"><dt>Earth UTC</dt><dd id="utc">15:25</dd></div>
        <div class="details__row"><dt>Coordinated Mars Time</dt><dd id="mtc">14:02</dd></div>
      </dl>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
